appId: dev.subtitle.workbench
productName: Subtitle Workbench
directories:
  app: apps/desktop
  output: release
files:
  - dist/**
  - package.json
  - '!node_modules/**'
extraResources:
  - from: assets/media-bin
    to: media-bin
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.video
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
