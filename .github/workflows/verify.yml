name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run typecheck && npm test && npm run test:media && npm run build
      - run: docker build -t subtitle-workbench:test .
      - name: Container startup smoke test
        run: |
          docker run -d --name subtitle-smoke -p 3000:3000 subtitle-workbench:test
          for i in $(seq 1 30); do if curl --fail http://localhost:3000/api/v1/auth/status; then break; fi; sleep 1; done
          curl --fail http://localhost:3000/api/v1/auth/status
          docker stop subtitle-smoke
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - run: npm run test:media
      - run: npm run desktop:package
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run android:sync
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: chmod +x apps/android/android/gradlew && apps/android/android/gradlew -p apps/android/android testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
