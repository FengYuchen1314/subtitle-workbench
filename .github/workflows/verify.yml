name: Build, verify and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run typecheck && npm test && npm run test:media && npm run build
      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t subtitle-workbench:test .
      - name: Container startup smoke test
        run: |
          docker run -d --name subtitle-smoke -p 3000:3000 subtitle-workbench:test
          trap 'docker rm -f subtitle-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail http://localhost:3000/api/v1/auth/status; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3000/api/v1/auth/status
      - name: Publish container image to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag subtitle-workbench:test "$image:sha-$short_sha"
          docker push "$image:sha-$short_sha"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag subtitle-workbench:test "$image:latest"
            docker push "$image:latest"
          fi

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install ffmpeg-full
      - if: runner.os == 'macOS'
        name: Select libass-enabled FFmpeg
        run: |
          echo "MEDIA_BIN_DIR=$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:media
        timeout-minutes: 10
      - if: runner.os == 'Windows'
        run: npm run desktop:package -- --publish never
      - if: runner.os == 'macOS'
        name: Build DMG with one transient retry
        run: |
          for attempt in 1 2; do
            if npm run desktop:package -- --publish never; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            mount | awk '/\/Volumes\/Subtitle Workbench/ { print $1 }' | while read -r device; do
              hdiutil detach -force "$device" || true
            done
            sleep 5
          done
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run android:sync
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: chmod +x apps/android/android/gradlew && apps/android/android/gradlew -p apps/android/android testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release files
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:12}"
          mkdir release-assets
          windows="$(find artifacts/desktop-windows-latest -type f -name '*.exe' -print -quit)"
          mac_intel="$(find artifacts/desktop-macos-15-intel -type f -name '*.dmg' -print -quit)"
          mac_arm="$(find artifacts/desktop-macos-15 -type f -name '*.dmg' -print -quit)"
          android="$(find artifacts/android-debug -type f -name '*.apk' -print -quit)"
          test -n "$windows" && test -n "$mac_intel" && test -n "$mac_arm" && test -n "$android"
          cp "$windows" "release-assets/Subtitle-Workbench-$short_sha-Windows-x64.exe"
          cp "$mac_intel" "release-assets/Subtitle-Workbench-$short_sha-macOS-x64.dmg"
          cp "$mac_arm" "release-assets/Subtitle-Workbench-$short_sha-macOS-arm64.dmg"
          cp "$android" "release-assets/Subtitle-Workbench-$short_sha-Android-debug.apk"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish prerelease for this push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:12}"
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          cat > release-notes.md <<EOF
          此预发行版本由 GitHub Actions 为提交 $COMMIT_SHA 自动构建。

          来源：$SOURCE_REF
          Docker：ghcr.io/${GITHUB_REPOSITORY,,}:sha-$short_sha

          这是未正式签名的开发预览版本。Windows、macOS 和 Android 可能显示安全提示；安装前请核对 SHA256SUMS.txt。真实云模型和设备兼容性范围见仓库 docs/VERIFICATION.md。
          EOF
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Development build $short_sha" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
